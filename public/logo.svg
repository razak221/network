<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="45%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#D97706" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Architectural Hexagonal Diamond Crest -->
  <path d="M50 8 L88 28 L88 72 L50 92 L12 72 L12 28 Z" 
        stroke="url(#goldGradient)" 
        stroke-width="2.5" 
        fill="#FFFFFF" 
        filter="url(#subtleGlow)" />

  <!-- Inner Architectural Arch Frame -->
  <path d="M50 16 L80 32 L80 68 L50 84 L20 68 L20 32 Z" 
        stroke="#E2E8F0" 
        stroke-width="1.2" 
        fill="none" />

  <!-- The Interlocking 'P' and 'D' Ribbon Monogram -->
  <!-- 'P' Stem & Loop -->
  <path d="M35 70 L35 30 L48 30 C55 30 59 34 59 41 C59 48 55 52 48 52 L35 52" 
        stroke="url(#goldGradient)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- 'D' Arc Flowing Seamlessly -->
  <path d="M48 30 L55 30 C64 30 71 37 71 50 C71 63 64 70 55 70 L42 70" 
        stroke="url(#goldGradient)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Radiant 4-Point Star Pinnacle (Pristine Touch) -->
  <path d="M50 4 Q50 14 55 14 Q50 14 50 24 Q50 14 45 14 Q50 14 50 4 Z" 
        fill="url(#goldGradient)" />
</svg>
